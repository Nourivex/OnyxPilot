<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- OnyxPilot activity-bar symbol: bear goggles in hex badge, simplified for 24px -->
  <!-- ears -->
  <circle cx="7.2" cy="6.4" r="1.7" fill="#141C2B" stroke="#8A9BB0" stroke-width="1.2"/>
  <circle cx="16.8" cy="6.4" r="1.7" fill="#141C2B" stroke="#8A9BB0" stroke-width="1.2"/>
  <!-- hex badge -->
  <polygon points="12,2 20.66,7 20.66,17 12,22 3.34,17 3.34,7"
    fill="#141C2B" stroke="#8A9BB0" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- goggles -->
  <rect x="5.6" y="9.6" width="12.8" height="5" rx="2.5"
    fill="#0B1220" stroke="#72DBE6" stroke-width="1.3"/>
  <line x1="12" y1="10.4" x2="12" y2="13.8" stroke="#72DBE6" stroke-width="0.9"/>
  <path d="M8 12.6 L9.6 10.4" stroke="#E6FBFF" stroke-width="0.9" stroke-linecap="round"/>
</svg>
